# SMART monitoring via smartctl emulation of Zabbix agent 2 plugin keys
# (official template 10383 "SMART by Zabbix agent 2" links and works unchanged)
#
# On VMs whose virtual disks report no SMART, prefix the discovery command with
# SMART_INCLUDE_UNSUPPORTED=1 to still discover those disks (values will be 0,
# exit_status=4). Not recommended on physical hosts: it keeps non-SMART devices in LLD.
UserParameter=smart.disk.discovery,/usr/bin/python3 /usr/local/bin/smart_agent1.py discovery
UserParameter=smart.disk.get[*],/usr/bin/python3 /usr/local/bin/smart_agent1.py get "$1" "$2"
